[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stcompass"
version = "0.1.0"
description = "Reproducible batch pipelines for large-scale spatial transcriptomics atlases (QC, clustering, cell-type annotation, gene programs, visualisation)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "STCompass contributors" }]
keywords = [
  "spatial-transcriptomics",
  "single-cell",
  "scanpy",
  "anndata",
  "bioinformatics",
  "pipeline",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]

# Lower bounds rather than exact pins: this package is installed alongside a
# user-managed scientific Python stack (scanpy/torch), where hard pins reliably
# create unsolvable environments. Reproducible runs should use a lock file --
# see docs/installation.md.
dependencies = [
  "anndata>=0.10",
  "h5py>=3.8",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scanpy>=1.10",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "tqdm>=4.65",
]

[project.optional-dependencies]
# Excel sample sheets (``stcompass annotate --metadata ...``).
excel = ["openpyxl>=3.1"]
# Tangram-based deconvolution for spot-based platforms; needs a CUDA build of torch.
tangram = ["tangram-sc>=1.0.4", "torch>=2.0"]
# SingleR-based labelling for single-cell-resolution platforms.
singler = ["singler>=0.4"]
# Filesystem watching for ``stcompass plot --watch``.
watch = ["watchdog>=3.0"]
dev = [
  "openpyxl>=3.1",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
]
all = [
  "openpyxl>=3.1",
  "singler>=0.4",
  "tangram-sc>=1.0.4",
  "torch>=2.0",
  "watchdog>=3.0",
]

[project.urls]
Homepage = "https://github.com/OWNER/STCompass"
Documentation = "https://github.com/OWNER/STCompass/tree/main/docs"
Repository = "https://github.com/OWNER/STCompass"
Issues = "https://github.com/OWNER/STCompass/issues"
Changelog = "https://github.com/OWNER/STCompass/blob/main/CHANGELOG.md"

[project.scripts]
stcompass = "stcompass.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stcompass"]

[tool.hatch.build.targets.sdist]
include = ["src/stcompass", "tests", "configs", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
# "._*" are AppleDouble sidecars created when this tree is edited from a macOS
# host on an exFAT volume; they are not UTF-8 and would otherwise abort the run.
extend-exclude = ["legacy", "._*"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RET",  # flake8-return
  "PTH",  # flake8-use-pathlib
  "TID",  # flake8-tidy-imports
  "RUF",
]
ignore = [
  "B008",    # function call in default argument -- not used here, keeps signatures readable
  "TID252",  # relative imports within the package are deliberate and idiomatic
  "RUF001",  # ambiguous unicode in strings: CJK docs are intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "error::DeprecationWarning:stcompass.*",
]
markers = [
  "requires_scanpy: test needs an installed scanpy stack",
]

[tool.coverage.run]
source = ["stcompass"]
branch = true
