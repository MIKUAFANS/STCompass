# Configuration that reproduces the behaviour of the original scripts in legacy/.
#
# Use this when you need output comparable to the published atlas rather than the
# package defaults.  Two differences from configs/example.yaml matter:
#
#   1. qc.filter_cells / qc.filter_genes are false.  The per-barcode count and
#      gene thresholds in QC_ALL0917.py were commented out when the atlas was
#      built, so every barcode was kept for downstream deconvolution.  Enabling
#      them (the package default) produces smaller, cleaner objects that will NOT
#      match the published files.
#
#   2. qc.cluster_method is leiden with resolution 1.0 -- scanpy's defaults at the
#      time -- while the separate louvain pass used the size-aware schedule below.
#
# Paths are placeholders; point them at your own copies.

paths:
  raw: /data/atlas/raw
  qc: /data/atlas/qc
  clustered: /data/atlas/clustered
  annotated: /data/atlas/annotated
  programs: /data/atlas/programs
  figures: /data/atlas/figures
  reference: /data/atlas/reference
  metadata: /data/atlas/samples.xlsx

n_jobs: 1
overwrite: false

qc:
  # The published atlas kept every barcode and every gene.
  filter_cells: false
  filter_genes: false
  # Written in full rather than as 1.0e4: PyYAML follows YAML 1.1, where an
  # exponent without an explicit sign parses as a string, not a float.
  target_sum: 10000.0
  n_top_genes: 3000
  hvg_flavor: seurat
  cluster_method: leiden
  resolution: 1.0
  compute_umap: true

clustering:
  # run_louvain.py: resolution chosen from the barcode count.
  method: louvain
  resolution_schedule:
    - [100, 1.2]
    - [500, 0.7]
    - [5000, 0.5]
    - [20000, 0.3]
  fallback_resolution: 0.2
  recompute_neighbors: false

annotation:
  label_key: cell_ontology_class
  min_cells_per_label: 2
  n_marker_genes: 100
  tangram_mode: cells
  tangram_epochs: 300
  device: auto
  n_gpus: 1
  n_jobs: 1
  singler_threads: 30
  species_column: OrganismSimple
  tissue_column: Tissue
  sample_column: SampleName
  platform_column: Biotech
  category_column: Biotech Categories
  category_filter: Spatial Transcriptomics

programs:
  # spatialVEG_0923.py used all non-empty genes (MAX_HVG = None).
  n_components: 10
  max_hvg: null
  batch_size: 4096
  epochs: 2
  row_chunk: 5000
  use_counts_layer: true
  random_state: 0
  save_float32: true

plot:
  format: pdf
  dpi: 300
  top_n_types: 3
